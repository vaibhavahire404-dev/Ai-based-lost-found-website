{% extends "base.html" %}{% block content %}<div class="card"><h2>Search Items</h2><form method="get"><input name="q" value="{{q}}" placeholder="Search item, category or location"><button>Search</button></form></div>{% for x in rows %}<div class="card"><h3>{{x['item_name']}}</h3><p>{{x['item_type']}} | {{x['category']}} | {{x['location']}}</p><a href="/matches/{{x['id']}}">Find Matches</a></div>{% endfor %}{% endblock %}
