{% extends "base.html" %}{% block content %}<div class="formbox"><h2>Search Items</h2><form><input name="q" value="{{q}}" placeholder="Search by name, category or location"><button>Search</button></form></div><div class="grid">{% for x in rows %}<div class="card">{% if x.image %}<img src="/static/uploads/{{x.image}}">{% endif %}<span class="tag">{{x.item_type}}</span><h3>{{x.item_name}}</h3><p>{{x.category}} • {{x.location}}</p></div>{% else %}<p>No matching records.</p>{% endfor %}</div>{% endblock %}
