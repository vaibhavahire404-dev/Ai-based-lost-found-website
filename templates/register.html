{% extends "base.html" %}

{% block content %}

<div class="card">

<h2>Create Account</h2>

<form method="POST">

<label>Name</label>

<input
    type="text"
    name="name"
    placeholder="Enter your name"
    required
>

<label>Email</label>

<input
    type="email"
    name="email"
    placeholder="Enter your email"
    required
>

<label>Password</label>

<input
    type="password"
    name="password"
    placeholder="Minimum 6 characters"
    required
>

<button type="submit">
Register
</button>

</form>

<p>
Already have an account?
<a href="/login">Login</a>
</p>

</div>

{% endblock %}
