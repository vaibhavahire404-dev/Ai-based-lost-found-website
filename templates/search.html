{% extends 'base.html' %}{% block content %}<h1>Search Results</h1><p>Results for “{{q}}”</p><div class="grid">{% for r in reports %}<article class="card"><span class="pill">{{r.report_type}}</span><h3>{{r.item_name}}</h3><p>{{r.category}} • {{r.location}}</p><p>{{r.report_date}}</p><a href="{{url_for('matches',report_id=r.id)}}">Find Matches →</a></article>{% else %}<p>No matching records found.</p>{% endfor %}</div>{% endblock %}
