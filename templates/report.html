{% extends 'base.html' %}{% block content %}<div class="formbox"><h1>Report Lost / Found Object</h1><form method="post" enctype="multipart/form-data"><label>Report type<select name="report_type"><option>Lost</option><option>Found</option></select></label><label>Item name<input name="item_name" required placeholder="e.g. Black Wallet"></label><label>Category<select name="category"><option>Mobile</option><option>Wallet</option><option>Bag</option><option>ID Card</option><option>Book</option><option>Keys</option><option>Other</option></select></label><label>Location<input name="location" required placeholder="e.g. College Lab 2"></label><label>Date<input type="date" name="report_date" required></label><label>Description<textarea name="description" placeholder="Colour, brand, identifying marks..."></textarea></label><label>Contact<input name="contact" required placeholder="Phone/email"></label><label>Object image<input type="file" name="image" accept="image/*"></label><button class="btn" type="submit">Submit Report</button></form></div>{% endblock %}
